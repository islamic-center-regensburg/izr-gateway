services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: izr-gateway:latest
    container_name: izr-gateway
    ports:
      - "8000:8080"
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/_gateway/health').status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge
    name: gateway-net
